name: Build sf-bridge APK

on:
  workflow_dispatch:
  push:
    branches: ["claude/june-laptop-door-acer-7xpif5"]
    paths:
      - "sf-bridge/app/**"
      - ".github/workflows/sf-bridge-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: sf-bridge/app
        run: |
          # The runner ships the Android SDK; pin Gradle via a freshly generated wrapper.
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sf-bridge-apk
          path: sf-bridge/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
